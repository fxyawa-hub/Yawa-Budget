spring:
  application:
    name: yawa-budget
  data:
    mongodb:
      database: yawa_budget
      uri: ${MONGODB_URI}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:86400000}

ai:
  llm:
    api-key: ${AI_LLM_API_KEY:}
    model: ${AI_LLM_MODEL:gemini-3.7-flash}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}